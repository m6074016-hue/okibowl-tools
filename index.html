<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>OKI BOWL</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body { font-family:'Hiragino Sans','Yu Gothic',sans-serif; background:#f4f4f0; color:#1a1a1a; margin:0; min-height:100vh; }

  .home { padding:24px; }
  .home .page { max-width:500px; margin:0 auto; }
  .home h1 { font-size:24px; font-weight:800; margin:16px 0 24px; letter-spacing:0.02em; }
  .home h1 span { color:#f5c842; }
  .card { background:#fff; border-radius:12px; padding:20px; margin-bottom:12px; text-decoration:none; color:#1a1a1a; display:block; box-shadow:0 1px 6px rgba(0,0,0,.06); cursor:pointer; border:none; width:100%; text-align:left; font-family:inherit; }
  .card:hover { background:#fafafa; }
  .card:active { background:#f0f0f0; }
  .card .emoji { font-size:32px; margin-bottom:6px; }
  .card .title { font-size:16px; font-weight:800; }
  .card .desc { font-size:12px; color:#666; margin-top:4px; }

  .frame-view { display:none; height:100vh; width:100%; flex-direction:column; background:#f4f4f0; }
  .frame-view.show { display:flex; }
  .frame-bar { display:flex; align-items:center; gap:12px; padding:10px 14px; background:#1a1a1a; color:#fff; flex-shrink:0; }
  .frame-bar button { background:#333; color:#fff; border:none; padding:8px 14px; border-radius:8px; font-size:13px; font-weight:700; cursor:pointer; font-family:inherit; }
  .frame-bar button:hover { background:#444; }
  .frame-bar .frame-title { font-size:13px; font-weight:700; flex:1; }
  .frame-bar .frame-title span { color:#f5c842; }
  iframe { flex:1; width:100%; border:none; background:#f4f4f0; }
</style>
</head>
<body>

<div class="home" id="home">
  <div class="page">
    <h1>OKI <span>BOWL</span></h1>
    <button class="card" onclick="openView('waste.html','🗑️ <span>廃棄記録シート</span>')">
      <div class="emoji">🗑️</div>
      <div class="title">廃棄記録シート</div>
      <div class="desc">廃棄が出たらすぐ入力（全スタッフOK）</div>
    </button>
    <button class="card" onclick="openView('app.html','📱 <span>OKI BOWL Manager</span>')">
      <div class="emoji">📱</div>
      <div class="title">OKI BOWL Manager</div>
      <div class="desc">店舗運営マネージャーアプリ</div>
    </button>
    <button class="card" onclick="openView('daily.html','📅 <span>2号店 日別工程表</span>')">
      <div class="emoji">📅</div>
      <div class="title">2号店 日別工程表</div>
      <div class="desc">2号店オープン準備・日別タスク管理</div>
    </button>
  </div>
</div>

<div class="frame-view" id="frameView">
  <div class="frame-bar">
    <button onclick="goHome()">← 戻る</button>
    <div class="frame-title" id="frameTitle"></div>
  </div>
  <iframe id="contentFrame" src="about:blank"></iframe>
</div>

<script>
const home = document.getElementById('home');
const frameView = document.getElementById('frameView');
const frameTitle = document.getElementById('frameTitle');
const contentFrame = document.getElementById('contentFrame');

// 旧PINフラグのクリーンアップ
try {
  localStorage.removeItem('okibowl_pl_unlocked');
  localStorage.removeItem('okibowl_pl_unlocked_v2');
} catch(e){}

function openView(src, titleHtml) {
  frameTitle.innerHTML = titleHtml;
  contentFrame.src = src;
  home.style.display = 'none';
  frameView.classList.add('show');
}
function goHome() {
  contentFrame.src = 'about:blank';
  frameView.classList.remove('show');
  home.style.display = 'block';
}
</script>

</body>
</html>
